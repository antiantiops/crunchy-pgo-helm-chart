name: Watch upstream OCI registry

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: watch-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Get current chart version
        id: current
        run: |
          APP=$(grep '^appVersion:' pgo/Chart.yaml | awk '{print $2}' | tr -d '"')
          VER=$(grep '^version:' pgo/Chart.yaml | awk '{print $2}' | tr -d '"')
          echo "appVersion=$APP" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Fetch latest from Crunchy OCI registry
        id: latest
        run: |
          mkdir -p /tmp/pgo-upstream
          helm pull oci://registry.developers.crunchydata.com/crunchydata/pgo \
            --destination /tmp/pgo-upstream
          TGZ=$(ls /tmp/pgo-upstream/pgo-*.tgz)
          APP=$(tar -xOzf "$TGZ" pgo/Chart.yaml | grep '^appVersion:' | awk '{print $2}' | tr -d '"')
          VER=$(tar -xOzf "$TGZ" pgo/Chart.yaml | grep '^version:' | awk '{print $2}' | tr -d '"')
          echo "appVersion=$APP" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.current.outputs.version }}" = "${{ steps.latest.outputs.version }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ Already up to date: ${{ steps.current.outputs.version }}"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "🆕 Update available: ${{ steps.current.outputs.version }} → ${{ steps.latest.outputs.version }}"
          fi

      # ---- Update chart source ----
      - name: Replace chart with upstream
        if: steps.compare.outputs.changed == 'true'
        run: |
          mkdir -p /tmp/pgo-extracted
          tar -xzf "${{ steps.latest.outputs.tgz }}" -C /tmp/pgo-extracted
          # Remove old chart contents, keep git history
          rm -rf pgo/templates pgo/crds
          rm -f pgo/Chart.yaml pgo/values.yaml pgo/.helmignore pgo/LICENSE.txt
          # Copy new chart contents
          cp -a /tmp/pgo-extracted/pgo/. pgo/

      # ---- Package + index + commit ----
      - name: Lint new chart
        if: steps.compare.outputs.changed == 'true'
        run: helm lint pgo

      - name: Package chart
        if: steps.compare.outputs.changed == 'true'
        run: helm package pgo

      - name: Update Helm repo index
        if: steps.compare.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.latest.outputs.version }}"
          if [ -f index.yaml ]; then
            helm repo index . --merge index.yaml \
              --url "https://github.com/${{ github.repository }}/releases/download/pgo-${VERSION}"
          else
            helm repo index . \
              --url "https://github.com/${{ github.repository }}/releases/download/pgo-${VERSION}"
          fi

      - name: Commit and push
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.latest.outputs.version }}"
          PREV="${{ steps.current.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pgo/ index.yaml "pgo-${VERSION}.tgz"
          git commit -m "chore: bump pgo ${PREV} → ${VERSION}"
          git push origin HEAD:main

      # ---- GitHub Release ----
      - name: Create GitHub release
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.latest.outputs.version }}"
          APP="${{ steps.latest.outputs.appVersion }}"
          gh release create "pgo-${VERSION}" \
            "pgo-${VERSION}.tgz" \
            --title "pgo-${VERSION}" \
            --notes "Helm chart release pgo-${VERSION} (appVersion: ${APP})"
